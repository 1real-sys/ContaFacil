<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="back-link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Voltar
      </a>
      <div class="auth-logo">CF</div>
      <h1>Criar conta</h1>
      <p>Comece a gerenciar suas finanças</p>
    </div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Nome de usuário</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Seu nome"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            placeholder="Mínimo 10 caracteres, 1 número, 1 maiúscula"
            autocomplete="new-password"
            required
          />
          <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())" tabindex="-1">
            @if (showPassword()) {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
        <div class="password-rules">
          @for (rule of passwordRules(); track rule.label) {
            <span class="rule" [class.pass]="rule.ok">
              {{ rule.ok ? '\u2713' : '\u2717' }} {{ rule.label }}
            </span>
          }
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar senha</label>
        <input
          id="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Repita a senha"
          autocomplete="new-password"
          required
        />
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading() || !passwordValid()">
        @if (loading()) {
          <span class="spinner"></span>
          Criando conta...
        } @else {
          Criar conta
        }
      </button>
    </form>

    <p class="auth-footer">
      Já tem conta? <a routerLink="/login">Entrar</a>
    </p>
  </div>
</div>
